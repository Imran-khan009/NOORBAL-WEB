# ==============================================================================
# NOORBAL — Production Netlify Configuration
# Framework: React + Vite + Netlify Functions (Express Commerce Engine)
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 1. API Route Redirection: Forward all /api/* requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 2. SPA Fallback: Ensures customer & admin routes load /index.html cleanly without 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API security and CORS headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PATCH, PUT, DELETE, OPTIONS"

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache Vite bundled assets for optimal performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
